# ArgoCD Application: GitOps-деплой прикладного слоя из репозитория.
# Управляет kustomize-оверлеем в корне репозитория (kustomization.yaml):
# приложение, Gateway API, конфиги мониторинга и логирования (raw-манифесты).
# ВНИМАНИЕ: замените repoURL на реальный публичный URL вашего репозитория.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mts-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nchekotko/devops-production-reference
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
