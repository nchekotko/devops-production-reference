# values для чарта grafana/loki (закреплён в scripts/05-logging.sh).
# Loki в режиме single-binary, файловое хранилище на PVC (StorageClass local-path),
# аутентификация отключена (внутренний стенд).
deploymentMode: SingleBinary

loki:
  # Доступ из кластера без аутентификации (стенд/демо).
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  # Хранение логов 7 дней (компактор в single-binary применяет retention).
  limits_config:
    retention_period: 168h

singleBinary:
  replicas: 1
  persistence:
    # Персистентное хранилище логов (StorageClass local-path от local-path-provisioner).
    enabled: true
    storageClass: local-path
    size: 10Gi
