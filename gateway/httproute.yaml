apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
  rules:
    # Правило 1: все запросы с путём "/" (и глубже) направляются на backend nginx.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nginx
          port: 80
    # Правило 2 (бонус): маршрутизация по path — /v1 направляется в тот же backend.
    # Демонстрирует расширенные возможности Gateway API (path-based routing).
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: nginx
          port: 80
