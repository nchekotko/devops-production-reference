# Второй HTTPRoute: hostname-based маршрутизация.
# Запрос с Host: hello.example.com уходит на backend nginx-v2 ("Hello World v2!").
# Проверка: curl -H 'Host: hello.example.com' http://<LB-IP>/
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx-host
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
  hostnames:
    - hello.example.com
  rules:
    - backendRefs:
        - name: nginx-v2
          port: 80
