# values для kube-prometheus-stack (release `kps`, namespace `monitoring`).
# Версия чарта закреплена в scripts/04-monitoring.sh (--version).
# Чарт из коробки ставит Prometheus, Grafana, Alertmanager, node-exporter,
# kube-state-metrics и их ServiceMonitor'ы.

grafana:
  enabled: true
  # Пароль администратора берётся из Secret `grafana-admin-secret`
  # (создаётся скриптом 04-monitoring.sh со случайным паролем; в репозитории
  # пароль НЕ хранится). Ключи по умолчанию: admin-user / admin-password.
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  # Персистентность дашбордов/настроек Grafana.
  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi

prometheus:
  prometheusSpec:
    # Персистентное хранилище метрик (StorageClass local-path, local-path-provisioner).
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    # Хранение метрик 7 дней.
    retention: 7d
    # По умолчанию Prometheus подхватывает ServiceMonitor/PrometheusRule по метке
    # `release: kps` (serviceMonitorSelectorNilUsesHelmValues / ruleSelectorNilUsesHelmValues).
