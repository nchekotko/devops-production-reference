# Второй вариант приложения для демонстрации traffic splitting в Gateway API.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf-v2
  namespace: default
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        access_log /dev/stdout;
        error_log  /dev/stderr;

        location / {
            default_type text/plain;
            return 200 'Hello World v2!';
        }
    }
