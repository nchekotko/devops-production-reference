apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: default
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        access_log /dev/stdout;
        error_log  /dev/stderr;

        location / {
            default_type text/plain;
            return 200 'Hello World!';
        }

        location = /stub_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
    }
